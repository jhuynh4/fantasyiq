name: Deploy

# Runs after a merge lands on main, not on every PR -- ci.yml already gates
# merges on tests passing (branch protection requires that check), so a
# commit reaching this workflow has already been verified. This workflow's
# job is strictly build-image -> push -> deploy, not re-running the suite.
on:
  push:
    branches: [main]
  # After a fresh `terraform apply` nothing is deployed until something runs
  # this; running it by hand from main (Actions tab) saves a throwaway commit.
  # The role's trust policy still requires the run to be on main.
  workflow_dispatch:

# id-token: write is what lets this workflow request an OIDC token from
# GitHub and exchange it for short-lived AWS credentials -- without it,
# aws-actions/configure-aws-credentials has nothing to authenticate with.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: fantasyiq
  ECS_CLUSTER: fantasyiq
  ECS_SERVICE: fantasyiq
  ECS_TASK_DEFINITION_FAMILY: fantasyiq
  CONTAINER_NAME: app
  # Fixed by infra/frontend.tf (project name + account id), so it survives a
  # destroy/apply cycle like the role ARN below.
  FRONTEND_BUCKET: fantasyiq-frontend-018326344181
  # Deterministic (a fixed IAM role name, not a generated id), so this
  # stays correct across a `terraform destroy` + `apply` cycle without
  # needing to be updated here -- see infra/github-oidc.tf's own comment
  # on why this ARN doesn't change.
  DEPLOY_ROLE_ARN: arn:aws:iam::018326344181:role/fantasyiq-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions below are pinned to major-version tags (@v4 etc),
      # not full commit SHAs. Pinning to a SHA is the more hardened choice
      # (immune to a tag being moved to different, possibly malicious code
      # after the fact) and is what GitHub's own ECS deployment docs do --
      # a reasonable upgrade later, not done here since it trades away
      # readability for a security margin that matters more at a larger
      # or more security-sensitive scale than a solo learning project.
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Tagged with the commit SHA, not "latest" -- ECR's tags are
      # immutable (see infra/ecr.tf), and a SHA tag makes every deployed
      # image traceable back to the exact commit that produced it.
      - name: Build and push the image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      # Fetches the live task definition rather than checking a static
      # task-definition.json into the repo (GitHub's own example does the
      # latter) -- this project's task definition content (cpu/memory/
      # secrets/env vars) is already fully owned by Terraform (infra/ecs.tf).
      # A second, repo-committed copy would be a second source of truth
      # that could silently drift from what Terraform actually applies.
      # amazon-ecs-render-task-definition patches a local copy of whichever
      # one it's given rather than AWS itself, so the current definition
      # has to be downloaded first either way.
      - name: Fetch the current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_DEFINITION_FAMILY" \
            --query taskDefinition > task-definition.json

      - name: Update the task definition with the new image
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      # wait-for-service-stability blocks until ECS reports the new
      # deployment's tasks passing their health checks -- this workflow
      # only reports success once the new version is genuinely serving
      # traffic, not just once the API call to update it was accepted.
      - name: Deploy the new task definition to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # Builds the frontend and publishes it. Independent of the backend job, so a
  # change to either can land and deploy without waiting on the other.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Vite names everything under assets/ with a hash of its contents, so
      # those files never change under the same name and can be cached for a
      # year. Everything else (index.html, the favicon) keeps its name, so
      # browsers must ask again each time. Assets go up first: a visitor who
      # gets the new index.html always finds the files it points to.
      # Nothing is deleted, so a tab still open on the previous version can
      # keep loading its own files.
      - name: Upload the build
        run: |
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" \
            --exclude "*" --include "assets/*" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/dist "s3://$FRONTEND_BUCKET" \
            --exclude "assets/*" \
            --cache-control "no-cache"

      # The distribution's id changes whenever the stack is recreated, so it
      # is looked up by the comment infra/frontend.tf gives it.
      - name: Clear the CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Comment=='fantasyiq frontend'].Id | [0]" \
            --output text)
          if [ -z "$DISTRIBUTION_ID" ] || [ "$DISTRIBUTION_ID" = "None" ]; then
            echo "No CloudFront distribution named 'fantasyiq frontend' was found." >&2
            exit 1
          fi
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"
