spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  datasource:
    hikari:
      # Each distinct @DynamicPropertySource/@TestConfiguration combination
      # across the IT/contract test suite gets its own cached Spring context
      # and therefore its own HikariCP pool, all pointed at the same shared
      # Testcontainers Postgres (see IntegrationTestBase). At Spring Boot's
      # default pool size (10), a dozen-plus contexts comfortably exceed
      # Postgres's default max_connections, causing intermittent
      # "FlywaySqlException" / connection failures for whichever context
      # happens to initialize once the limit's already been hit. Tests run
      # sequentially, so there's no real concurrency need per pool.
      maximum-pool-size: 3
      minimum-idle: 1

logging:
  level:
    com.fantasyiq: INFO

# Fast retry/circuit-breaker timings so contract tests exercising failure
# paths (EspnStatsProviderContractTest) don't spend real wall-clock time
# waiting out production-sized backoffs.
resilience4j:
  retry:
    instances:
      espnApi:
        max-attempts: 3
        wait-duration: 10ms
      weatherApi:
        max-attempts: 3
        wait-duration: 10ms
      oddsApi:
        max-attempts: 3
        wait-duration: 10ms
  circuitbreaker:
    instances:
      espnApi:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 1s
      weatherApi:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 1s
      oddsApi:
        sliding-window-size: 4
        minimum-number-of-calls: 4
        wait-duration-in-open-state: 1s
