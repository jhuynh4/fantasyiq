spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fantasyiq
    username: fantasyiq
    password: fantasyiq
  jpa:
    hibernate:
      ddl-auto: validate # schema is owned by Flyway migrations, never Hibernate auto-DDL
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.fantasyiq: DEBUG
    org.hibernate.SQL: DEBUG
